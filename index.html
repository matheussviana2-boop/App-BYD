<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12968d">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Roteiros BYD · UniLitoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Exo+2:ital,wght@1,600;1,700;1,800&display=swap">
<style>
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: uma coluna de app de celular (máx. 460px), centralizada no desktop; placa da rota em teal Univale, linha do tempo de paradas. Identidade: teal profundo + teal claro do logo, vermelho só como ponto de marca */
/* Layout: uma coluna de app de celular (máx. 480px). Identidade Consórcio UniLitoral: teal do símbolo + azul-marinho do logotipo */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --surface-2:#e6eef0; --fg:#1f2343; --muted:#5b6478; --line:#d3dde2;
  --brand:#12968d; --brand-2:#1fb5a8; --navy:#23234a; --brand-red:#23234a;
  --accent:#12968d; --accent-ink:#ffffff; --plate:#0e7f78; --plate-ink:#ffffff;
  --ok:#0f8a5f; --ok-bg:#dcf3ea; --warn:#9a5a00; --warn-bg:#fdecd2; --bad:#b3261e; --bad-bg:#fbe0dd; --info:#0f7a73; --info-bg:#d9f1ef;
  --f-brand:"Exo 2","Segoe UI",system-ui,sans-serif;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;min-height:100%}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-brand);font-style:italic;font-weight:800;font-size:24px;letter-spacing:.01em;margin:0;line-height:1;color:var(--fg)}
.brand h1 i{color:var(--brand);font-style:inherit}
.logo{height:30px;width:auto;display:block}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow .sep{width:1px;align-self:stretch;background:var(--line)}
.swoosh{position:absolute;right:-60px;top:-40px;width:200px;height:200px;border-radius:50%;border:26px solid var(--brand-2);opacity:.12;pointer-events:none}
.top{overflow:hidden}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:3px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;height:42px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;padding:0 14px 0 42px}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.sect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.rcard:active{transform:scale(.99)}
.plate{font-family:var(--f-display);font-weight:800;background:var(--plate);color:var(--plate-ink);border-radius:8px;padding:6px 8px;text-align:center;line-height:1;min-width:66px}
.plate .k{display:block;font-size:11px;letter-spacing:.12em;opacity:.85}
.plate .n{display:block;font-size:24px;letter-spacing:.02em;margin-top:2px}
.rmeta{min-width:0}
.rmeta .l1{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.rmeta .l2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.pin{color:var(--accent)}
.chev{color:var(--muted)}
.empty{padding:24px 8px;color:var(--muted);text-align:center}
/* rota */
.rhead{display:flex;gap:14px;align-items:center;margin-top:6px}
.rhead .plate{min-width:96px;padding:8px 10px}
.rhead .plate .n{font-size:38px}
.rhead h2{font-family:var(--f-brand);font-style:italic;font-weight:700;font-size:22px;margin:0;line-height:1.1}
.rhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.facts div{background:var(--surface);padding:10px 8px;text-align:center}
.facts b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.facts span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.alert{margin-top:12px;border-radius:14px;background:var(--warn-bg);color:var(--fg);padding:12px 14px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.alert ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.actions{display:grid;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.legs{display:flex;gap:6px;flex-wrap:wrap}
.legs .btn{flex:1 1 140px;height:56px;font-size:15px}
.legs .btn span{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.legs .btn small{font-weight:500;font-size:12px;color:var(--muted)}
.legnote{font-size:13px;color:var(--muted);line-height:1.4;padding:0 2px}
.tl{list-style:none;margin:16px 0 0;padding:0;position:relative}
.stop{display:grid;grid-template-columns:60px 28px 1fr;column-gap:6px;column-gap:8px;position:relative}
.stop .time{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;text-align:right;padding-top:10px;line-height:1}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--line)}
.stop:first-child .rail::before{top:18px}
.stop.last .rail::before{bottom:auto;height:18px}
.dot{position:relative;margin-top:9px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);z-index:1;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.stop.checked .dot{color:#fff}
.stop.checked .dot{background:var(--ok);border-color:var(--ok)}
.sbody{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;min-width:0}
.sbody .pn{font-weight:700;font-size:16px;line-height:1.25}
.sbody .pb{font-size:13px;color:var(--muted);margin-top:2px}
.srow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sbtn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px;text-decoration:none;color:var(--fg);cursor:pointer}
.sbtn.check{background:transparent}
.sbtn.check.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.paxbtn{margin-top:8px;border:0;background:none;padding:0;color:var(--info);font-weight:700;font-size:14px;cursor:pointer}
.pax{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.pax li{font-size:13px;background:var(--surface-2);border-radius:6px;padding:3px 7px}
.pax li.f{background:var(--info-bg);color:var(--info);font-weight:600}
.arrive{font-size:13px;font-weight:700;margin-top:6px}
.arrive.late{color:var(--bad)} .arrive.early{color:var(--ok)} .arrive.on{color:var(--ok)}
.dest .sbody{background:var(--plate);color:var(--plate-ink);border-color:transparent}
.dest .dot{border-color:var(--plate);background:var(--plate)}
.note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
.proto{margin-top:22px;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.proto b{color:var(--fg)}
.proto ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- abas Lista / Mapa ---- */
.vtabs{margin-top:12px}
.vtabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
/* ---- tela de mapa (tela cheia) ---- */
.mapview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.mapbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mapbar .plate{min-width:54px;padding:4px 6px}
.mapbar .plate .n{font-size:20px}
.mapbar .plate .k{font-size:9px}
.mapbar .t{min-width:0;flex:1}
.mapbar .t b{display:block;font-family:var(--f-brand);font-style:italic;font-size:17px;line-height:1.1}
.mapbar .t span{font-size:12px;color:var(--muted)}
#map{flex:1;min-height:0;background:var(--surface-2)}
.maneuver{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));z-index:500;background:var(--brand);color:#fff;border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,60,56,.25)}
.maneuver .ic{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.maneuver .d{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.maneuver .x{font-size:15px;font-weight:600;line-height:1.25}
.sheet{background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 18px rgba(0,40,38,.08)}
.nextrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.nextrow .num{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.nextrow .num.dest{background:var(--fg)}
.nextrow .pn{font-weight:700;font-size:16px;line-height:1.2}
.nextrow .pb{font-size:13px;color:var(--muted)}
.nextrow .tm{text-align:right;font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.nextrow .tm small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted)}
.ctrls{display:flex;gap:8px}
.ctrls .btn{flex:1;height:50px}
.ctrls .sq{flex:0 0 50px;padding:0}
.status{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status .pill{background:var(--surface-2);border-radius:999px;padding:2px 9px;font-weight:600}
.status .pill.warn{background:var(--warn-bg);color:var(--warn)}
.status .pill.ok{background:var(--ok-bg);color:var(--ok)}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand-2);transition:width .4s}
/* marcadores Leaflet */
.mk{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk.approx{border-style:dashed}
.mk.next{background:var(--brand);color:#fff;transform:scale(1.15)}
.mk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mk.dest{background:var(--fg);border-color:var(--fg);color:#fff;font-size:11px;width:34px;height:34px}
.me{width:20px;height:20px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.leaflet-popup-content{font-family:var(--f-body);font-size:14px;margin:10px 12px}
.leaflet-popup-content b{display:block;font-size:15px}
.mapnote{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:15px;z-index:400;background:var(--surface-2)}
.mapnote b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}
.mapwrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.src{font-size:12px;color:var(--muted);margin-top:4px}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.mapoff{margin:8px 2px 0}
.leaflet-tooltip.lbl{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leaflet-tooltip.lbl b{color:var(--brand)}
.leaflet-tooltip.lbl::before{display:none}

/* ---- embarques ---- */
.plate .k{color:#ffffff;opacity:.9}
.brand h1 i{color:var(--brand)}
.banner{margin-top:12px;border-radius:12px;padding:10px 12px;background:var(--info-bg);color:var(--fg);font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.banner.warn{background:var(--warn-bg)}
.btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn:disabled,.iconbtn:disabled{opacity:.5}
.linkbtn{border:0;background:none;padding:0;color:var(--brand);font-weight:700;cursor:pointer;text-decoration:underline}
.foot{margin-top:22px;text-align:center}
.status{margin-top:10px}
.facts b small{font-size:15px;color:var(--muted);font-weight:600}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cnt{flex:none;font-family:var(--f-display);font-weight:700;font-size:16px;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.cnt.ok{background:var(--ok-bg);color:var(--ok)}
.plist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.prow{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-size:16px;font-weight:600}
.prow:disabled{cursor:default;color:var(--muted)}
.prow .box{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--brand);display:grid;place-items:center;color:#fff}
.prow.on{background:var(--ok-bg);border-color:transparent}
.prow.on .box{background:var(--ok);border-color:var(--ok)}
.prow .nm{flex:1;min-width:0}
.prow .nm em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--info)}
.prow .hr{flex:none;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--ok);font-variant-numeric:tabular-nums}
.prow.conf{cursor:default;background:var(--bad-bg);border-color:transparent;flex-wrap:wrap;justify-content:space-between;font-weight:500;font-size:15px}
.cbtns{display:flex;gap:6px}
.addbtn{margin-top:8px;width:100%;height:42px;border-radius:10px;border:1.5px dashed var(--line);background:transparent;color:var(--brand);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.addform{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.addform input,.mbox input{height:46px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font:inherit;font-size:16px;background:var(--surface);color:var(--fg)}
.addform .ctrls .btn{flex:1}
.stop.checked .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,24,50,.45);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbox{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.mbox b{font-family:var(--f-brand);font-style:italic;font-size:20px}
.mbox p{margin:0;color:var(--muted);font-size:14px}
.dest .sbody{background:var(--navy);color:#fff}

.banner.alt{background:#fff4dc;border:1px solid #f0c46a}
.banner.alt ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.rcard.alt{border-color:#e7b24a}

.banner.inst{background:var(--info-bg)}
.banner .ctrls{display:flex;gap:8px;width:100%}
.banner .ctrls .btn{flex:1}

</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* Roteiros BYD · UniLitoral
   Pontos de apanha, horários e passageiros de cada rota, com marcação de embarque.
   A planilha compartilhada é SÓ LIDA (via Apps Script). Os embarques vão para uma planilha SEPARADA. */
"use strict";
const CFG = {
  API: "https://script.google.com/macros/s/AKfycbw5J5Qco1221P5S7j8oIP52UWWNe1OIhoiC6mdgXQPxdvnpMGAgGT_uTT7yX8FPRMrZ0w/exec",
  CHAVE: "YGmqNauujipdlrOI",  // a mesma do Code.gs
  ATUALIZAR_MIN: 30,        // relê a planilha a cada 30 min
  ENVIO_SEG: 60,            // tenta enviar embarques pendentes a cada 1 min
  LOTE: 8                   // embarques por envio
};
const EMBED = typeof window.__EMBED__ !== "undefined";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
const mem = {};
const store = {
  get(k, d) { if (k in mem) return JSON.parse(mem[k]); try { const v = localStorage.getItem("rbyd:" + k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set(k, v) { mem[k] = JSON.stringify(v); try { localStorage.setItem("rbyd:" + k, mem[k]) } catch (e) { } }
};
const pad = n => String(n).padStart(2, "0");
const hoje = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hhmm = (d = new Date()) => pad(d.getHours()) + ":" + pad(d.getMinutes());
function isoLocal(d = new Date()) { const o = -d.getTimezoneOffset(), s = o >= 0 ? "+" : "-"; return hoje(d) + "T" + hhmm(d) + ":" + pad(d.getSeconds()) + s + pad(Math.floor(Math.abs(o) / 60)) + ":" + pad(Math.abs(o) % 60) }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600) }
const aparelho = (() => { let a = store.get("aparelho", ""); if (!a) { a = "AP-" + Math.random().toString(36).slice(2, 7).toUpperCase(); store.set("aparelho", a) } return a })();

/* ---------- leitura da planilha (via Apps Script) ---------- */
function tm(x) { const m = String(x || "").match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, "0") + ":" + m[2] : "" }
function nomeCurto(n) {
  const p = String(n).split(/\s+/).filter(Boolean); if (!p.length) return "";
  const stop = new Set(["DE", "DA", "DO", "DOS", "DAS", "E"]); const last = p.slice(1).filter(w => !stop.has(w.toUpperCase()));
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  return cap(p[0]) + (last.length ? " " + last[last.length - 1][0].toUpperCase() + "." : "");
}
const titulo = x => String(x).split(" ").map(w => (w === w.toUpperCase() && w.length > 2) ? w.charAt(0) + w.slice(1).toLowerCase() : w).join(" ");
function empresa(x) { const u = String(x).toUpperCase(); if (u.startsWith("LITORAL")) return "Litoral Norte"; if (u === "UNIVALE") return "Univale"; if (u === "IBS") return "IBS"; return "" }

// linha = [turno, nome, cidade, bairro, ponto, hora, rota, empresa, programado, solicitado, ref]
function montarRotas(linhas) {
  const routes = new Map();
  for (const r of linhas) {
    const [turno, nome, cid, bai, ponto, hora, rota, emp, prog, sol, ref] = r.map(v => String(v ?? "").trim());
    if (!nome || !/^(T1|ADM|TAXI)\s*\d+/.test(rota)) continue;
    if (!routes.has(rota)) routes.set(rota, { id: rota, turno, emp: "", prog: "", sol: "", pax: [] });
    const R = routes.get(rota);
    R.emp = R.emp || empresa(emp); R.prog = R.prog || prog.toUpperCase(); R.sol = R.sol || sol.toUpperCase();
    R.pax.push({ n: nome, c: titulo(cid), b: titulo(bai), p: ponto, t: tm(hora), ref: ref || "" });
  }
  return [...routes.values()].map(R => {
    const st = new Map();
    for (const p of [...R.pax].sort((a, b) => a.t.localeCompare(b.t))) {
      const k = norm(p.p) + "|" + p.t;
      if (!st.has(k)) st.set(k, { p: p.p, t: p.t, b: p.b, c: p.c, pax: [] });
      st.get(k).pax.push([p.n, p.ref]);
    }
    return { id: R.id, turno: R.turno, emp: R.emp, prog: R.prog, sol: R.sol, stops: [...st.values()] };
  });
}
// chamada ao Apps Script: primeiro por fetch SEM cookies (evita o erro do Google quando o celular
// tem mais de uma conta Google logada); se não der, tenta pelo método antigo (JSONP)
async function chamar(url, ms) {
  ms = ms || 60000;
  try {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms);
    const r = await fetch(url, { credentials: "omit", redirect: "follow", cache: "no-store", signal: ctrl.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d || d.status !== "ok") throw Object.assign(new Error((d && d.mensagem) || "o script respondeu com erro"), { doScript: true });
    return d;
  } catch (e) {
    if (e.doScript) throw e;                    // o script respondeu: não adianta tentar de novo
    try { return await jsonp(url, ms) } catch (e2) { throw new Error(e2.message + " / " + (e.name === "AbortError" ? "tempo esgotado" : e.message)) }
  }
}
function jsonp(url, ms) {
  return new Promise((res, rej) => {
    const cb = "__a" + Math.random().toString(36).slice(2), s = document.createElement("script");
    const fim = () => { clearTimeout(to); delete window[cb]; s.remove() };
    const to = setTimeout(() => { fim(); rej(new Error("a planilha demorou para responder")) }, ms || 60000);
    window[cb] = d => { fim(); d && d.status === "ok" ? res(d) : rej(new Error((d && d.mensagem) || "o script respondeu com erro")) };
    s.onerror = () => { fim(); rej(new Error("sem conexão com a planilha")) };
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + cb + "&_=" + Date.now();
    document.head.appendChild(s);
  });
}

let DATA = { rotas: [], fonte: "", quando: "", carregando: false, erro: "" };
function prepararRotas(rotas) {
  rotas.forEach(r => {
    r.pax = r.stops.reduce((a, s) => a + s.pax.length, 0);
    r.ini = r.stops[0]?.t || ""; r.fim = r.stops[r.stops.length - 1]?.t || "";
    r.veic = r.sol || r.prog || (r.id.startsWith("TAXI") ? "TÁXI" : "—");
    const k = r.id.split(" "); r.k = k[0]; r.n = k.slice(1).join(" ");
  });
  return rotas;
}
async function atualizar(manual) {
  if (EMBED || DATA.carregando) return;
  DATA.carregando = true; if (manual) render();
  try {
    const antes = store.get("vivo2", null);
    const d = await chamar(CFG.API + (antes && antes.versao ? "?v=" + encodeURIComponent(antes.versao) : ""));
    const quandoJa = new Date().toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    if (d.igual && antes) {                  // planilha não mudou: nada para baixar
      antes.quando = quandoJa; antes.em = Date.now(); store.set("vivo2", antes);
      DATA.fonte = "vivo"; DATA.quando = quandoJa; DATA.carregando = false; DATA.erro = "";
      if (manual) toast("Roteiros em dia: nada mudou na planilha");
      render(); return;
    }
    const rotas = montarRotas(d.linhas);
    if (rotas.length < 20) throw new Error("leitura incompleta da planilha");
    const quando = new Date().toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    const nAlt = registrarAlteracoes(antes ? antes.rotas : null, rotas, d.alteradas || {});
    store.set("vivo2", { rotas, quando, em: Date.now(), versao: d.versao || "" });
    DATA = { rotas: prepararRotas(rotas), fonte: "vivo", quando, carregando: false, erro: "" };
    if (nAlt) toast(nAlt === 1 ? "1 rota foi alterada na planilha" : nAlt + " rotas foram alteradas na planilha");
    else if (manual) toast("Roteiros atualizados");
  } catch (e) {
    DATA.carregando = false; DATA.erro = e.message;
    if (manual) toast("Não foi possível atualizar: " + e.message);
  }
  render();
}
/* ---------- aviso de roteiro alterado ----------
   O script informa quando cada rota mudou na planilha (alteradas: {rota: data/hora}).
   Se o aparelho tem a leitura anterior, o app também descreve o que mudou. O aviso vale por 24 h. */
const ALT_HORAS = 24;
function resumoMudancas(a, b) {
  const itens = [], mapa = r => new Map(r.stops.map(s => [norm(s.p), s]));
  const A = mapa(a), B = mapa(b);
  B.forEach((s, k) => {
    const o = A.get(k);
    if (!o) itens.push("Novo ponto: " + s.p + " (" + s.t + ")");
    else if (o.t !== s.t) itens.push("Horário mudou em " + s.p + ": " + o.t + " → " + s.t);
  });
  A.forEach((s, k) => { if (!B.has(k)) itens.push("Ponto retirado: " + s.p) });
  const pa = new Set(a.stops.flatMap(s => s.pax.map(p => p[1] || p[0]))), pb = new Set(b.stops.flatMap(s => s.pax.map(p => p[1] || p[0])));
  const ent = [...pb].filter(x => !pa.has(x)).length, sai = [...pa].filter(x => !pb.has(x)).length;
  if (ent) itens.push(ent === 1 ? "1 passageiro incluído" : ent + " passageiros incluídos");
  if (sai) itens.push(sai === 1 ? "1 passageiro retirado" : sai + " passageiros retirados");
  const va = a.sol || a.prog, vb = b.sol || b.prog;
  if (va !== vb && vb) itens.push("Veículo: " + (va || "—") + " → " + vb);
  return itens;
}
function registrarAlteracoes(velhas, novas, alteradas) {
  const alt = store.get("alt", {}), agora = Date.now(), porId = new Map((velhas || []).map(r => [r.id, r]));
  let n = 0;
  novas.forEach(r => {
    const antes = porId.get(r.id);
    const itens = !velhas ? [] : antes ? resumoMudancas(antes, r) : ["Rota nova"];
    const srv = alteradas[r.id] ? new Date(alteradas[r.id]).getTime() || 0 : 0;
    if (itens.length) {                                   // este aparelho viu a mudança
      alt[r.id] = { em: srv && agora - srv < 30 * 60000 ? srv : agora, itens }; n++;
    } else if (srv && (!alt[r.id] || alt[r.id].em < srv - 60000)) {   // o script avisou de uma mudança que o aparelho não tinha visto
      alt[r.id] = { em: srv, itens: [] };
      if (velhas && agora - srv < ALT_HORAS * 3600e3) n++;
    }
  });
  Object.keys(alt).forEach(k => { if (agora - alt[k].em > ALT_HORAS * 3600e3) delete alt[k] });
  store.set("alt", alt);
  return n;
}
function alteracao(r) { const a = store.get("alt", {})[r.id]; return a && Date.now() - a.em < ALT_HORAS * 3600e3 ? a : null }
const quandoTxt = t => { const d = new Date(t); return (hoje(d) === hoje() ? "hoje" : pad(d.getDate()) + "/" + pad(d.getMonth() + 1)) + " às " + hhmm(d) };

}

/* ---------- embarques: guardados no aparelho e enviados para a planilha de registros ---------- */
const chEmb = r => "emb:" + hoje() + ":" + r.id;      // { "s<i>:<ref|nome>": {h:"06:16", t:iso} }
const chExt = r => "ext:" + hoje() + ":" + r.id;      // [{id, i, nome, h, t}]
const paxKey = (i, p) => "s" + i + ":" + (p[1] || p[0]);
function fila() { return store.get("fila", []) }
// junta os toques feitos em sequência (ex.: 15 passageiros no mesmo ponto) num envio só
let tEnvio = null;
function enfileirar(ev) { const f = fila(); f.push(ev); store.set("fila", f); atualizarSync(); clearTimeout(tEnvio); tEnvio = setTimeout(enviar, 2000) }
let enviando = false;
async function enviar() {
  if (EMBED || enviando) return;
  let f = fila(); if (!f.length) return atualizarSync();
  enviando = true; atualizarSync();
  try {
    while (f.length) {
      const lote = f.slice(0, CFG.LOTE);
      const r = await chamar(CFG.API + "?acao=registrar&k=" + CFG.CHAVE + "&ev=" + encodeURIComponent(JSON.stringify(lote)), 45000);
      const ok = new Set(r.ids || lote.map(e => e.id));
      f = fila().filter(e => !ok.has(e.id)); store.set("fila", f);
    }
  } catch (e) { /* sem sinal: tenta de novo depois */ }
  enviando = false; atualizarSync();
}
setInterval(enviar, CFG.ENVIO_SEG * 1000);
window.addEventListener("online", enviar);
function syncTxt() {
  const n = fila().length;
  if (EMBED) return `<span class="pill">Prévia: os embarques ficam só neste aparelho</span>`;
  if (enviando) return `<span class="pill">Enviando ${n} registro${n > 1 ? "s" : ""}…</span>`;
  if (n) return `<span class="pill warn">${n} registro${n > 1 ? "s" : ""} aguardando sinal para envio</span>`;
  return `<span class="pill ok">Todos os embarques enviados</span>`;
}
function atualizarSync() { const el = $("#syncp"); if (el) el.innerHTML = syncTxt() }

function evento(r, i, s, nome, ref, tipo, acao, quando) {
  return { id: uid(), quando: quando || isoLocal(), data: hoje(), turno: r.turno, rota: r.id, parada: i + 1, ponto: s.p, horaPrev: s.t,
    ref: ref || "", nome, tipo, acao, motorista: "", aparelho };
}
function marcar(r, i, p) {
  const m = store.get(chEmb(r), {}), k = paxKey(i, p), s = r.stops[i];
  if (m[k]) return;
  const d = new Date(); m[k] = { h: hhmm(d), t: isoLocal(d) }; store.set(chEmb(r), m);
  enfileirar(evento(r, i, s, p[0], p[1], "lista", "embarcou", m[k].t));
}
function desmarcar(r, i, p) {
  const m = store.get(chEmb(r), {}), k = paxKey(i, p); if (!m[k]) return;
  delete m[k]; store.set(chEmb(r), m);
  enfileirar(evento(r, i, r.stops[i], p[0], p[1], "lista", "desfeito"));
}
function adicionar(r, i, nome) {

  const x = { id: uid(), i, nome, h: hhmm(d), t: isoLocal(d) }; ex.push(x); store.set(chExt(r), ex);
  enfileirar(evento(r, i, r.stops[i], nome, "", "adicionado", "embarcou", x.t));
}
function remover(r, xid) {
  const ex = store.get(chExt(r), []), x = ex.find(e => e.id === xid); if (!x) return;
  store.set(chExt(r), ex.filter(e => e.id !== xid));
  enfileirar(evento(r, x.i, r.stops[x.i], x.nome, "", "adicionado", "desfeito"));
}

/* ---------- limpeza: apaga do aparelho as marcações com mais de 7 dias (já estão na planilha de registros) ---------- */
function limparAntigos() {
  try {
    const lim = hoje(new Date(Date.now() - 7 * 864e5));
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i), m = k && k.match(/^rbyd:(emb|ext):(\d{4}-\d{2}-\d{2}):/);
      if (m && m[2] < lim) localStorage.removeItem(k);
      if (k === "rbyd:vivo") localStorage.removeItem(k);   // cópia da versão anterior
    }
  } catch (e) { }
}

  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (pedidoInstalar) return `<div class="banner inst"><div><b>Instale o app no celular.</b> Ele fica com ícone na tela e abre mesmo sem sinal.</div><div class="ctrls"><button class="btn sm" id="binstnao">Agora não</button><button class="btn sm primary" id="binst">Instalar app</button></div></div>`;
  if (ios) return `<div class="banner inst"><div><b>Instale o app:</b> no Safari, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>.</div><div class="ctrls"><button class="btn sm" id="binstnao">Ok</button></div></div>`;
  // Chrome só oferece o botão automático depois de algum uso da página; até lá, mostra o caminho pelo menu
  const android = /android/i.test(navigator.userAgent);
  return `<div class="banner inst"><div><b>Instale o app:</b> no Chrome, toque no menu <b>⋮</b> e escolha <b>${android ? "Adicionar à tela inicial → Instalar" : "Transmitir, salvar e compartilhar → Instalar página como app"}</b>.</div><div class="ctrls"><button class="btn sm" id="binstnao">Ok</button></div></div>`;
}
if (!EMBED && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => { });

/* ---------- roteador ---------- */
function render() { if (editando()) return; if (!state.rota) return renderHome(); return renderRoute() }
limparAntigos();
iniciarDados();

</script>
