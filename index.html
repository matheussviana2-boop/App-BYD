<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00928a">
<meta name="robots" content="noindex,nofollow">
<title>Roteiros BYD · Univale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Exo+2:ital,wght@1,600;1,700;1,800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: uma coluna de app de celular (máx. 460px), centralizada no desktop; placa da rota em teal Univale, linha do tempo de paradas. Identidade: teal profundo + teal claro do logo, vermelho só como ponto de marca */
:root{
  --bg:#f3f7f7; --surface:#ffffff; --surface-2:#e4eeed; --fg:#10201f; --muted:#56706d; --line:#cfdedc;
  --brand:#00928a; --brand-2:#21c6be; --brand-red:#e5273f;
  --accent:#00928a; --accent-ink:#ffffff; --plate:#00928a; --plate-ink:#ffffff;
  --ok:#1f8a4c; --ok-bg:#dff3e7; --warn:#a35a00; --warn-bg:#fdebcf; --bad:#b3261e; --bad-bg:#fbe0dd; --info:#00756f; --info-bg:#d9f3f1;
  --f-brand:"Exo 2","Segoe UI",system-ui,sans-serif;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;min-height:100%}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-brand);font-style:italic;font-weight:800;font-size:24px;letter-spacing:.01em;margin:0;line-height:1;color:var(--fg)}
.brand h1 i{color:var(--brand);font-style:inherit}
.logo{height:34px;width:auto;display:block}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow .sep{width:1px;align-self:stretch;background:var(--line)}
.swoosh{position:absolute;right:-60px;top:-40px;width:200px;height:200px;border-radius:50%;border:26px solid var(--brand-2);opacity:.12;pointer-events:none}
.top{overflow:hidden}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:3px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;height:42px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:16px;padding:0 14px 0 42px}
.search svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.sect{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.rcard:active{transform:scale(.99)}
.plate{font-family:var(--f-display);font-weight:800;background:var(--plate);color:var(--plate-ink);border-radius:8px;padding:6px 8px;text-align:center;line-height:1;min-width:66px}
.plate .k{display:block;font-size:11px;letter-spacing:.12em;opacity:.85}
.plate .n{display:block;font-size:24px;letter-spacing:.02em;margin-top:2px}
.rmeta{min-width:0}
.rmeta .l1{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.rmeta .l2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.pin{color:var(--accent)}
.chev{color:var(--muted)}
.empty{padding:24px 8px;color:var(--muted);text-align:center}
/* rota */
.rhead{display:flex;gap:14px;align-items:center;margin-top:6px}
.rhead .plate{min-width:96px;padding:8px 10px}
.rhead .plate .n{font-size:38px}
.rhead h2{font-family:var(--f-brand);font-style:italic;font-weight:700;font-size:22px;margin:0;line-height:1.1}
.rhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:14px}
.facts div{background:var(--surface);padding:10px 8px;text-align:center}
.facts b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}
.facts span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.alert{margin-top:12px;border-radius:14px;background:var(--warn-bg);color:var(--fg);padding:12px 14px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.alert ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:15px}
.actions{display:grid;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.legs{display:flex;gap:6px;flex-wrap:wrap}
.legs .btn{flex:1 1 140px;height:56px;font-size:15px}
.legs .btn span{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.legs .btn small{font-weight:500;font-size:12px;color:var(--muted)}
.legnote{font-size:13px;color:var(--muted);line-height:1.4;padding:0 2px}
.tl{list-style:none;margin:16px 0 0;padding:0;position:relative}
.stop{display:grid;grid-template-columns:60px 28px 1fr;column-gap:6px;column-gap:8px;position:relative}
.stop .time{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;text-align:right;padding-top:10px;line-height:1}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:0;width:3px;background:var(--line)}
.stop:first-child .rail::before{top:18px}
.stop.last .rail::before{bottom:auto;height:18px}
.dot{position:relative;margin-top:9px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);z-index:1;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.stop.checked .dot{color:#fff}
.stop.checked .dot{background:var(--ok);border-color:var(--ok)}
.sbody{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px;min-width:0}
.sbody .pn{font-weight:700;font-size:16px;line-height:1.25}
.sbody .pb{font-size:13px;color:var(--muted);margin-top:2px}
.srow{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.sbtn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px;text-decoration:none;color:var(--fg);cursor:pointer}
.sbtn.check{background:transparent}
.sbtn.check.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.paxbtn{margin-top:8px;border:0;background:none;padding:0;color:var(--info);font-weight:700;font-size:14px;cursor:pointer}
.pax{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
.pax li{font-size:13px;background:var(--surface-2);border-radius:6px;padding:3px 7px}
.pax li.f{background:var(--info-bg);color:var(--info);font-weight:600}
.arrive{font-size:13px;font-weight:700;margin-top:6px}
.arrive.late{color:var(--bad)} .arrive.early{color:var(--ok)} .arrive.on{color:var(--ok)}
.dest .sbody{background:var(--plate);color:var(--plate-ink);border-color:transparent}
.dest .dot{border-color:var(--plate);background:var(--plate)}
.note{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5}
.proto{margin-top:22px;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.proto b{color:var(--fg)}
.proto ul{margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- abas Lista / Mapa ---- */
.vtabs{margin-top:12px}
.vtabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
/* ---- tela de mapa (tela cheia) ---- */
.mapview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.mapbar{display:flex;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mapbar .plate{min-width:54px;padding:4px 6px}
.mapbar .plate .n{font-size:20px}
.mapbar .plate .k{font-size:9px}
.mapbar .t{min-width:0;flex:1}
.mapbar .t b{display:block;font-family:var(--f-brand);font-style:italic;font-size:17px;line-height:1.1}
.mapbar .t span{font-size:12px;color:var(--muted)}
#map{flex:1;min-height:0;background:var(--surface-2)}
.maneuver{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));z-index:500;background:var(--brand);color:#fff;border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,60,56,.25)}
.maneuver .ic{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.maneuver .d{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.maneuver .x{font-size:15px;font-weight:600;line-height:1.25}
.sheet{background:var(--surface);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 18px rgba(0,40,38,.08)}
.nextrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.nextrow .num{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px}
.nextrow .num.dest{background:var(--fg)}
.nextrow .pn{font-weight:700;font-size:16px;line-height:1.2}
.nextrow .pb{font-size:13px;color:var(--muted)}
.nextrow .tm{text-align:right;font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.nextrow .tm small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted)}
.ctrls{display:flex;gap:8px}
.ctrls .btn{flex:1;height:50px}
.ctrls .sq{flex:0 0 50px;padding:0}
.status{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status .pill{background:var(--surface-2);border-radius:999px;padding:2px 9px;font-weight:600}
.status .pill.warn{background:var(--warn-bg);color:var(--warn)}
.status .pill.ok{background:var(--ok-bg);color:var(--ok)}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand-2);transition:width .4s}
/* marcadores Leaflet */
.mk{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk.approx{border-style:dashed}
.mk.next{background:var(--brand);color:#fff;transform:scale(1.15)}
.mk.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mk.dest{background:var(--fg);border-color:var(--fg);color:#fff;font-size:11px;width:34px;height:34px}
.me{width:20px;height:20px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
.leaflet-popup-content{font-family:var(--f-body);font-size:14px;margin:10px 12px}
.leaflet-popup-content b{display:block;font-size:15px}
.mapnote{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:15px;z-index:400;background:var(--surface-2)}
.mapnote b{display:block;color:var(--fg);font-size:17px;margin-bottom:6px}
.mapwrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.src{font-size:12px;color:var(--muted);margin-top:4px}

</style>
</head>

<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>

};

function fmtDist(m) { return m >= 1000 ? (m / 1000).toFixed(m >= 10000 ? 0 : 1).replace(".", ",") + " km" : Math.max(10, Math.round(m / 10) * 10) + " m" }
function hav(a, b) { const R = 6371000, r = Math.PI / 180; const dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r; const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)) }
function distToSeg(p, a, b) { // metros, projeção local
  const k = Math.cos(p[0] * Math.PI / 180) * 111320, K = 110540;
  const P = [p[1] * k, p[0] * K], A = [a[1] * k, a[0] * K], B = [b[1] * k, b[0] * K];
  const dx = B[0] - A[0], dy = B[1] - A[1], L = dx * dx + dy * dy; let t = L ? ((P[0] - A[0]) * dx + (P[1] - A[1]) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
  return Math.hypot(P[0] - (A[0] + t * dx), P[1] - (A[1] + t * dy));
}

/* ---------- dados: planilha ao vivo (só leitura) ou cópia ---------- */
function tm(x) { const m = String(x || "").match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, "0") + ":" + m[2] : "" }
function nomeCurto(n) {
  const p = String(n).split(/\s+/).filter(Boolean); if (!p.length) return "";
  const stop = new Set(["DE", "DA", "DO", "DOS", "DAS", "E"]); const last = p.slice(1).filter(w => !stop.has(w.toUpperCase()));
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
  return cap(p[0]) + (last.length ? " " + last[last.length - 1][0].toUpperCase() + "." : "");
}
function cidadeStd(c) {
  const n = norm(c).replace(/['’]/g, "").replace(/\s+/g, " ");
  if (n.startsWith("camacari")) return "Camaçari";
  if (n.startsWith("dias d")) return "Dias d'Ávila";
  if (n.startsWith("simoes")) return "Simões Filho";
  if (n.startsWith("lauro")) return "Lauro de Freitas";
  if (n.startsWith("mata de sao")) return "Mata de São João";
  if (n.startsWith("salvador")) return "Salvador";
  return c;
}
const titulo = x => String(x).split(" ").map(w => (w === w.toUpperCase() && w.length > 2) ? w.charAt(0) + w.slice(1).toLowerCase() : w).join(" ");
function empresa(x) { const u = String(x).toUpperCase(); if (u.startsWith("LITORAL")) return "Litoral Norte"; if (u === "UNIVALE") return "Univale"; if (u === "IBS") return "IBS"; return "" }

// linhas = [turno, nome, cidade, bairro, ponto, hora, rota, empresa, programado, solicitado]
function montarRotas(porAba) {
  const routes = new Map();
  for (const [turno, linhas] of porAba) {
    for (const r of linhas) {
      const [, nome, cid, bai, ponto, hora, rota, emp, prog, sol] = r.map(v => String(v ?? "").trim());
      if (!nome || nome === "Nome" || !/^(T1|ADM|TAXI)\s*\d+/.test(rota)) continue;
      if (!routes.has(rota)) routes.set(rota, { id: rota, turno, emp: "", prog: "", sol: "", pax: [] });
      const R = routes.get(rota);
      R.emp = R.emp || empresa(emp); R.prog = R.prog || prog.toUpperCase(); R.sol = R.sol || sol.toUpperCase();
      R.pax.push({ n: nomeCurto(nome), c: titulo(cid), b: titulo(bai), p: ponto, t: tm(hora) });
    }
  }
  return [...routes.values()].map(R => {
    const st = new Map();
    for (const p of [...R.pax].sort((a, b) => a.t.localeCompare(b.t))) {
      const k = p.p.toLowerCase() + "|" + p.t;
      if (!st.has(k)) st.set(k, { p: p.p, t: p.t, b: p.b, c: p.c, pax: [] });
      st.get(k).pax.push([p.n, ""]);
    }
    return { id: R.id, turno: R.turno, emp: R.emp, prog: R.prog, sol: R.sol, stops: [...st.values()] };
  });
}
function gvizAba(nome) {
  return new Promise((res, rej) => {
    const cb = "__g" + Math.random().toString(36).slice(2), s = document.createElement("script");
    const fim = () => { clearTimeout(to); delete window[cb]; s.remove() };
    const to = setTimeout(() => { fim(); rej(new Error("tempo esgotado")) }, 20000);
    window[cb] = d => { fim(); d && d.status === "ok" ? res(d.table) : rej(new Error("planilha respondeu com erro")) };
    s.onerror = () => { fim(); rej(new Error("sem acesso à planilha")) };
    // colunas C..L (a coluna B, de telefone, nunca é baixada)
    const tq = encodeURIComponent("select C,D,E,F,G,H,I,J,K,L");
    s.src = `https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=0&sheet=${encodeURIComponent(nome)}&tq=${tq}`;
    document.head.appendChild(s);
  });
}
function celula(c) {
  if (!c) return "";
  if (Array.isArray(c.v)) return String(c.v[0]).padStart(2, "0") + ":" + String(c.v[1]).padStart(2, "0"); // timeofday
  if (typeof c.v === "string" && c.v.startsWith("Date(")) { const n = c.v.match(/\d+/g).map(Number); return String(n[3] || 0).padStart(2, "0") + ":" + String(n[4] || 0).padStart(2, "0") }
  return c.f != null ? c.f : (c.v != null ? c.v : "");
}
async function carregarAoVivo() {
  const out = [];
  for (const [aba, turno] of CFG.ABAS) {
    const t = await gvizAba(aba);
    out.push([turno, t.rows.map(r => r.c.map(celula))]);
  }
  const rotas = montarRotas(out);
  const pax = rotas.flatMap(r => r.stops.flatMap(s => s.pax.map(() => s.t)));
  const ok = pax.filter(Boolean).length / Math.max(1, pax.length);
  if (rotas.length < 20 || ok < 0.95) throw new Error("leitura incompleta da planilha");
  return rotas;
}

function prepararRotas(rotas) {
  rotas.forEach(r => {

    const k = r.id.split(" "); r.k = k[0]; r.n = k.slice(1).join(" ");
  });
  return rotas;
}

  map: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  me: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  vol: on => on ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke-linecap="round"/></svg>' : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6M22 9l-5 6" stroke-linecap="round"/></svg>',
  arrow: mod => {
    const rot = { "right": 90, "sharp right": 135, "slight right": 45, "left": -90, "sharp left": -135, "slight left": -45, "uturn": 180, "straight": 0 }[mod] ?? 0;
    return `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${rot}deg)"><path d="M12 20V5M6 11l6-6 6 6"/></svg>`;
  },
  flag: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M5 21V4h12l-2 4 2 4H5"/></svg>'
};
const plate = r => `<div class="plate"><span class="k">${esc(r.k)}</span><span class="n">${esc(r.n)}</span></div>`;

/* ---------- tela inicial ---------- */
function fonteTxt() { return `Última atualização · ${esc(DATA.quando)}` }
function card(r) {
  const fav = favs().includes(r.id);
  return `<button class="rcard" data-r="${esc(r.id)}">${plate(r)}
    <div class="rmeta"><div class="l1">${esc(r.ini)} → ${esc(r.fim)} · ${r.stops.length} paradas</div>
    <div class="l2">${esc(r.veic)} · ${r.pax} passageiros${r.emp ? " · " + esc(r.emp) : ""}</div></div>
    <span class="${fav ? "pin" : "chev"}">${fav ? icon.star(true) : icon.chev}</span></button>`;
}
function renderHome() {
  const term = norm(state.q);
  const all = DATA.rotas.filter(r => r.turno === state.turno);
  const match = r => !term || norm(r.id).includes(term) || norm(r.id).replace(/\s/g, "").includes(term.replace(/\s/g, "")) || r.stops.some(s => norm(s.p + " " + s.b + " " + s.c).includes(term));
  const list = all.filter(match);
  const fv = favs(); const pinned = DATA.rotas.filter(r => fv.includes(r.id));
  $("#app").innerHTML = `
  <header class="top">
    <div class="brand"><div class="brandrow"><img class="logo" alt="Univale" src="${LOGO}"><span class="sep"></span><div><h1>Roteiros <i>BYD</i></h1><small>${fonteTxt()} · ${DATA.rotas.length} rotas</small></div></div></div>
    <div class="seg" role="group" aria-label="Turno">
      <button id="t1" aria-pressed="${state.turno === "Turno 1"}">Turno 1</button>
      <button id="tadm" aria-pressed="${state.turno === "ADM"}">ADM</button>
    </div>
    <label class="search">${icon.search}<input id="q" type="search" placeholder="Buscar rota, bairro ou ponto" value="${esc(state.q)}" autocomplete="off" aria-label="Buscar rota, bairro ou ponto"></label>
  </header>
  ${pinned.length && !term ? `<div class="sect">Minhas rotas</div><div class="list">${pinned.map(card).join("")}</div>` : ""}
  <div class="sect">${term ? list.length + " resultado" + (list.length === 1 ? "" : "s") : state.turno + " · " + all.length + " rotas"}</div>
  <div class="list">${list.map(card).join("") || `<div class="empty">Nenhuma rota com “${esc(state.q)}” no ${esc(state.turno)}.<br>Tente o número da rota (ex.: 015) ou o nome do bairro.</div>`}</div>
  ${DATA.erro && DATA.fonte !== "vivo" ? `<p class="src">Não foi possível ler a planilha agora (${esc(DATA.erro)}). Mostrando a última atualização disponível.</p>` : ""}`;
  $("#t1").onclick = () => { state.turno = "Turno 1"; store.set("turno", state.turno); renderHome() };
  $("#tadm").onclick = () => { state.turno = "ADM"; store.set("turno", state.turno); renderHome() };
  const inp = $("#q");
  inp.oninput = e => { state.q = e.target.value; const pos = inp.selectionStart; renderHome(); const n = $("#q"); n.focus(); try { n.setSelectionRange(pos, pos) } catch (_) { } };
  document.querySelectorAll(".rcard").forEach(b => b.onclick = () => abrirRota(b.dataset.r));
}

/* ---------- tela da rota: aba Lista ---------- */
function abrirRota(id) { state.rota = id; state.open = {}; state.mapa = false; render(); window.scrollTo(0, 0) }
const rotaAtual = () => DATA.rotas.find(x => x.id === state.rota);
function renderRoute() {
  const r = rotaAtual(); if (!r) { state.rota = null; return renderHome() }
  const fav = favs().includes(r.id);
  $("#app").innerHTML = `
  <header class="top"><div class="brand">
    <button class="iconbtn" id="back" aria-label="Voltar para a lista de rotas">${icon.back}Rotas</button>
    <button class="iconbtn" id="fav" aria-pressed="${fav}" style="${fav ? "color:var(--accent)" : ""}">${icon.star(fav)}${fav ? "Minha rota" : "Fixar rota"}</button>
  </div></header>
  <div class="rhead">${plate(r)}<div><h2>${esc(r.veic)}</h2><p>${esc(r.turno)}${r.emp ? " · " + esc(r.emp) : ""}</p></div></div>
  <div class="facts">
    <div><b>${esc(r.ini)}</b><span>1ª apanha</span></div>
    <div><b>${r.stops.length}</b><span>Paradas</span></div>
    <div><b>${r.pax}</b><span>Passageiros</span></div>
  </div>
  <div class="seg vtabs" role="group" aria-label="Visualização">
    <button aria-pressed="true">${icon.list}Pontos e horários</button>
    <button id="vmapa" aria-pressed="false">${icon.map}Ver no mapa</button>
  </div>
  <ol class="tl">
    ${r.stops.map((s, i) => {
      return `<li class="stop">
        <div class="time">${esc(s.t)}</div><div class="rail"><span class="dot">${i + 1}</span></div>
        <div class="sbody"><div class="pn">${esc(s.p)}</div><div class="pb">${esc(s.b)} · ${esc(s.c)}</div>
          <button class="paxbtn" data-i="${i}" aria-expanded="${!!state.open[i]}">${s.pax.length} passageiro${s.pax.length > 1 ? "s" : ""} ${state.open[i] ? "▴" : "▾"}</button>
          ${state.open[i] ? (s.pax.some(p => p[0]) ? `<ul class="pax">${s.pax.map(p => `<li>${esc(p[0])}</li>`).join("")}</ul>` : `<p class="src">Os nomes aparecem quando a planilha online estiver acessível.</p>`) : ""}
        </div></li>`;
    }).join("")}
    <li class="stop last dest"><div class="time"></div><div class="rail"><span class="dot"></span></div>
      <div class="sbody"><div class="pn">BYD Camaçari<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand-red);margin-left:6px;vertical-align:middle"></span></div><div class="pb" style="color:inherit;opacity:.8">Destino final</div></div></li>
  </ol>`;
  $("#back").onclick = () => { state.rota = null; renderHome(); window.scrollTo(0, 0) };
  $("#fav").onclick = () => { let f = favs(); f = f.includes(r.id) ? f.filter(x => x !== r.id) : [...f, r.id]; store.set("fav", f); renderRoute(); toast(f.includes(r.id) ? "Rota fixada no início" : "Rota removida de Minhas rotas") };
  $("#vmapa").onclick = () => { state.mapa = true; render() };
  document.querySelectorAll(".paxbtn").forEach(b => b.onclick = () => { const i = b.dataset.i; state.open[i] = !state.open[i]; renderRoute() });
}

/* ---------- geocodificação (com cache no aparelho) ---------- */
const geoKey = s => "geo:" + norm(s.p + "|" + s.b + "|" + s.c);
let ultimoGeo = 0;
async function nominatim(q) {
  const espera = 1100 - (Date.now() - ultimoGeo); if (espera > 0) await sleep(espera); // política de uso: 1 consulta/s
  ultimoGeo = Date.now();
  const u = `${CFG.GEOCODER}?format=jsonv2&limit=1&countrycodes=br&accept-language=pt-BR&bounded=1&viewbox=${CFG.VIEWBOX}&q=${encodeURIComponent(q)}`;
  const j = await fetch(u, { headers: { "Accept": "application/json" } }).then(r => r.ok ? r.json() : []);
  return j && j[0] ? [Number(j[0].lat), Number(j[0].lon)] : null;
}
async function localizar(s) {
  const fixo = window.__PONTOS__ && window.__PONTOS__[norm(s.p + "|" + s.b + "|" + s.c)]; // coordenadas conferidas pela operação (pontos.json)
  if (fixo) return { ll: fixo, approx: false };
  const c = store.get(geoKey(s), null); if (c) return c;
  const cid = cidadeStd(s.c);
  const tentativas = [[`${s.p}, ${s.b}, ${cid}, Bahia`, false], [`${s.p}, ${cid}, Bahia`, false], [`${s.b}, ${cid}, Bahia`, true], [`${cid}, Bahia`, true]];
  for (const [q, approx] of tentativas) {
    if (approx) { const kb = "geob:" + norm(q); const cb = store.get(kb, null); if (cb) { const v = { ll: cb, approx: true }; store.set(geoKey(s), v); return v } }
    let ll = null; try { ll = await nominatim(q) } catch (e) { return null }
    if (ll) { const v = { ll, approx }; store.set(geoKey(s), v); if (approx) store.set("geob:" + norm(q), ll); return v }
  }
  return null;
}

/* ---------- roteamento (OSRM) e instruções em português ---------- */
async function rotear(pontos) { // pontos: [[lat,lon],...]
  const coords = pontos.map(p => p[1].toFixed(6) + "," + p[0].toFixed(6)).join(";");
  const u = `${CFG.ROUTER}${coords}?overview=full&geometries=geojson&steps=true`;
  const j = await fetch(u).then(r => r.ok ? r.json() : null);
  if (!j || j.code !== "Ok") throw new Error("rota indisponível");
  const rt = j.routes[0];
  return {
    linha: rt.geometry.coordinates.map(c => [c[1], c[0]]), dist: rt.distance, dur: rt.duration,
    legs: rt.legs.map(l => ({
      dist: l.distance, dur: l.duration,
      steps: l.steps.map(st => ({ ...st.maneuver, nome: st.name || st.ref || "", dist: st.distance, geo: st.geometry.coordinates.map(c => [c[1], c[0]]), saida: st.maneuver.exit }))
    }))
  };
}
/* ---------- tela de mapa (estática: só visualização do roteiro) ---------- */
const mv = { map: null, camadas: null, linha: null, ll: [], approx: [], rota: null, erroRota: false };
function renderMapa() {
  const r = rotaAtual();
  $("#app").innerHTML = `
  <div class="mapview">
    <div class="mapbar">
      <button class="iconbtn" id="mvoltar" aria-label="Voltar para pontos e horários">${icon.list}Lista</button>
      ${plate(r)}<div class="t"><b>${esc(r.veic)}</b><span>${r.stops.length} paradas · ${r.pax} passageiros</span></div>
    </div>
    <div class="mapwrap"><div id="map" aria-label="Mapa da rota"></div><div id="mnote"></div></div>
    <div class="sheet" id="sheet"></div>
  </div>`;
  $("#mvoltar").onclick = () => { state.mapa = false; render() };
  if (EMBED || !window.L) {
    $("#mnote").innerHTML = `<div class="mapnote"><div><b>O mapa abre no app instalado</b>Esta prévia no navegador do Claude bloqueia mapas externos. No link do app (Netlify) esta tela mostra a rota e os pontos de parada.</div></div>`;
    $("#sheet").innerHTML = `<div class="status">Pré-visualização</div>`; return;
  }
  const map = L.map("map", { zoomControl: true, attributionControl: true }).setView([-12.85, -38.40], 11);
  L.tileLayer(CFG.TILES, { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  Object.assign(mv, { map, camadas: L.layerGroup().addTo(map), linha: null, ll: [], approx: [], rota: null, erroRota: false });
  folha("Localizando os pontos…");
  prepararMapa(r);
}
async function prepararMapa(r) {
  const id = r.id;
  for (let i = 0; i < r.stops.length; i++) {
    const g = await localizar(r.stops[i]);
    if (state.rota !== id || !state.mapa) return;
    mv.ll[i] = g ? g.ll : null; mv.approx[i] = g ? g.approx : true;
    folha(`Localizando os pontos… ${i + 1} de ${r.stops.length}`); desenharMarcadores(r);
  }
  mv.ll[r.stops.length] = [CFG.DEST.lat, CFG.DEST.lon];
  desenharMarcadores(r); enquadrar();
  try { mv.rota = await rotear(mv.ll.filter(Boolean)); desenharLinha(mv.rota.linha) }
  catch (e) { mv.erroRota = true; desenharLinha(mv.ll.filter(Boolean), true) }
  if (state.rota === id && state.mapa) folha();
}
function desenharMarcadores(r) {
  if (!mv.camadas) return; mv.camadas.clearLayers();
  r.stops.forEach((s, i) => {
    if (!mv.ll[i]) return;
    const mk = L.marker(mv.ll[i], { icon: L.divIcon({ className: "", html: `<div class="mk${mv.approx[i] ? " approx" : ""}">${i + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) });
    mk.bindPopup(`<b>${i + 1}. ${esc(s.p)}</b>${esc(s.t)} · ${s.pax.length} passageiro${s.pax.length > 1 ? "s" : ""}<br>${esc(s.b)} · ${esc(s.c)}${mv.approx[i] ? "<br><i>Localização aproximada (bairro)</i>" : ""}`);
    mv.camadas.addLayer(mk);
  });
  const d = mv.ll[r.stops.length] || [CFG.DEST.lat, CFG.DEST.lon];
  mv.camadas.addLayer(L.marker(d, { icon: L.divIcon({ className: "", html: `<div class="mk dest">BYD</div>`, iconSize: [34, 34], iconAnchor: [17, 17] }) }).bindPopup("<b>BYD Camaçari</b>Destino final"));
}
function desenharLinha(ll, reta) {
  if (mv.linha) mv.linha.remove();
  mv.linha = L.polyline(ll, { color: getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#00928a", weight: reta ? 3 : 6, opacity: .85, dashArray: reta ? "6 8" : null }).addTo(mv.map);
}
function enquadrar() { const pts = mv.ll.filter(Boolean); if (pts.length && mv.map) mv.map.fitBounds(L.latLngBounds(pts), { padding: [40, 40] }) }
function folha(msg) {
  const r = rotaAtual(); const el = $("#sheet"); if (!el || !r) return;
  const aprox = mv.approx.filter(Boolean).length;
  el.innerHTML = `
    <div class="nextrow">
      <div class="num">1</div>
      <div><div class="pb">1ª apanha</div><div class="pn">${esc(r.stops[0].p)}</div><div class="pb">${esc(r.stops[0].b)} · ${esc(r.stops[0].c)}</div></div>
      <div class="tm">${esc(r.ini)}<small>${r.stops.length} paradas</small></div>
    </div>
    <div class="status">
      ${msg ? `<span class="pill">${esc(msg)}</span>` : ""}
      ${mv.rota && !msg ? `<span class="pill">Trajeto estimado: ${fmtDist(mv.rota.dist)} · ${Math.round(mv.rota.dur / 60)} min</span>` : ""}
      ${mv.erroRota && !msg ? `<span class="pill warn">Trajeto indisponível: linhas retas entre os pontos</span>` : ""}
      ${aprox && !msg ? `<span class="pill warn">${aprox} ponto${aprox > 1 ? "s" : ""} com localização aproximada</span>` : ""}
    </div>
    <div class="ctrls"><button class="btn" id="benq">${icon.map}Ver rota inteira</button></div>
    <p class="src" style="margin:0">Toque em um ponto numerado para ver o nome, o horário e os passageiros.</p>`;
  const b = $("#benq"); if (b) b.onclick = enquadrar;
}

/* ---------- roteador de telas ---------- */
function render() { if (!state.rota) return renderHome(); if (state.mapa) return renderMapa(); return renderRoute() }
iniciarDados();

</script>
