<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#12968d">
<title>Painel da operação BYD · UniLitoral</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Exo+2:ital,wght@1,700;1,800&display=swap">
<style>
/* Menu lateral (Resumo · Rota a rota) + área de conteúdo. Identidade UniLitoral: teal + azul-marinho; status com ícone e texto, nunca só cor */
:root{
  --bg:#f1f5f6; --surface:#ffffff; --surface-2:#e6eef0; --fg:#161a36; --muted:#4a5468; --line:#cfd9de;
  --brand:#12968d; --brand-d:#0e7f78; --navy:#23234a; --adm:#4a55b8;
  --ok:#1f9e6a; --leve:#e0a21b; --atr:#d9582b; --sem:#aab4c0;
  --ok-bg:#d2f0e3; --ok-ink:#0b5e3c; --leve-bg:#fdecc8; --leve-ink:#7a4f00; --atr-bg:#fde0d6; --atr-ink:#8f2d0c; --fora-bg:#dbe6fb; --fora-ink:#1a3f7a;
  --f-brand:"Exo 2","Segoe UI",system-ui,sans-serif; --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.nav{background:var(--navy);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.nav .logo{background:#fff;border-radius:12px;padding:10px 12px}
.nav .logo img{height:30px;display:block}
.nav h1{font-family:var(--f-brand);font-style:italic;font-weight:800;font-size:20px;margin:0;line-height:1.1}
.nav h1 i{color:#3cc7bb;font-style:inherit}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:rgba(255,255,255,.8);border-radius:10px;padding:11px 12px;font-weight:700;font-size:16px;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:#fff;color:var(--navy)}
.nav .foot{margin-top:auto;font-size:13px;color:rgba(255,255,255,.7)}
.main{min-width:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:22px 48px}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-left,0px))}
  .nav .logo img{height:24px} .nav h1{font-size:17px} .nav .foot{display:none}
  .nav ul{flex-direction:row;width:100%} .nav ul li{flex:1}
  .nav button{justify-content:center;padding:9px}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{font-family:var(--f-brand);font-style:italic;font-size:26px;margin:0;line-height:1.1}
.head p{margin:3px 0 0;color:var(--muted);font-size:14px}
.status{font-size:14px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input[type=date]{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:disabled{opacity:.5}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.selt{display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.selt span{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.selt select{height:36px;border:0;background:transparent;font-weight:700;font-size:16px;padding:0 6px;cursor:pointer}
.det{text-align:center}
.det .dh{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.det .motr{justify-content:center;flex-wrap:wrap}
.det .motr .em::before{content:"· "}
.det th,.det td{text-align:center;vertical-align:middle}
.det .chips{justify-content:center}
.det td:last-child{width:50%}
.det .key{justify-content:center}
.det{position:relative}
.det .dtop{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.det .xr{justify-self:end;height:38px;font-size:14px;white-space:nowrap}
@media (max-width:1350px){.det .dtop{grid-template-columns:1fr}.det .dtop>span{display:none}.det .xr{justify-self:center;order:-1}}
.det .chip{white-space:nowrap}
.btn.xl{background:#0e7f78;border-color:#0e7f78;color:#fff}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-num);font-weight:700;font-size:42px;line-height:1.05;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi b small{font-size:22px;color:var(--muted)}
.kpi > small{color:var(--muted);font-size:14px;display:block}
.kpi .cmp{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:14px;font-weight:700;margin-top:6px}
.kpi .cmp em{white-space:nowrap}
.kpi .cmp em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
@media (max-width:1100px){.charts{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h3{margin:0;font-size:17px}
.panel .d{margin:3px 0 0;color:var(--muted);font-size:14px}
.chart{position:relative;margin-top:10px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--f-body);font-size:12px;fill:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:8px}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--fg)}
.stack{display:flex;height:36px;border-radius:6px;overflow:hidden;gap:2px;margin-top:12px}
.stack div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;min-width:0}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--navy);color:#fff;border-radius:8px;padding:8px 11px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.22);max-width:280px;line-height:1.45}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th[data-k]{cursor:pointer;user-select:none}
td{padding:9px 8px;border-bottom:1px solid var(--surface-2);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:#f4f9f9}
.num{text-align:right;white-space:nowrap}
.hora{font-family:var(--f-num);font-weight:700;font-size:19px}
.plate{display:inline-block;font-family:var(--f-num);font-weight:800;background:var(--brand-d);color:#fff;border-radius:7px;padding:3px 7px;line-height:1;text-align:center;min-width:54px}
.plate small{display:block;font-size:10px;letter-spacing:.1em;color:#fff;opacity:.92}
.plate b{display:block;font-size:20px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok-ink)}.p-leve{background:var(--leve-bg);color:var(--leve-ink)}.p-atr{background:var(--atr-bg);color:var(--atr-ink)}.p-sem{background:var(--surface-2);color:var(--muted)}
.md{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media (max-width:1100px){.md{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.side input,.side select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px;width:100%}
.rl{max-height:calc(100vh - 300px);min-height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
@media (max-width:1100px){.rl{max-height:360px}}
.rl button{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;cursor:pointer}
.rl button[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px rgba(18,150,141,.28)}
.rl .t small{display:block;color:var(--muted);font-size:14px}
.motr{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 14px;border-radius:10px;background:#e8f5f4;border:1px solid #b9e0dc}
.motr .mi{font-size:22px}
.motr small{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.motr b{font-size:19px;color:#0e5f5a}
.motr b.nd{font-size:16px;color:var(--muted);font-weight:600}
.motr .em{white-space:nowrap;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.rl small.mot{color:#0e5f5a;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
@media (max-width:600px){.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini div{background:var(--bg);border-radius:10px;padding:8px 10px}
.mini span{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mini b{font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;border-radius:7px;padding:4px 9px;font-weight:600;border:1px solid transparent}
.chip .i{font-weight:800}
.chip .h{font-family:var(--f-num);font-weight:700;font-size:16px}
.chip.e{background:var(--ok-bg);color:var(--ok-ink);border-color:#9fd9bf}
.chip.x{background:var(--atr-bg);color:var(--atr-ink);border-color:#f3b8a3}
.chip.x .nm{text-decoration:line-through}
.chip.f{background:var(--fora-bg);color:var(--fora-ink);border-color:#aac3ef}
.chip.n{background:var(--surface-2);color:var(--muted)}
.key{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--surface-2);font-size:14px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{background:var(--leve-bg);color:var(--leve-ink);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:15px}
</style>
</head>

    <h1>Painel da operação <i>BYD</i></h1>
    <ul>
      <li><button data-v="resumo">▦ Resumo</button></li>
      <li><button data-v="rotas">☰ Rota a rota</button></li>
    </ul>
    <div class="foot">Dados dos embarques marcados no app Roteiros BYD.</div>
  </nav>
  <main class="main" id="main"></main>
</div>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
const API = "https://script.google.com/macros/s/AKfycbw5J5Qco1221P5S7j8oIP52UWWNe1OIhoiC6mdgXQPxdvnpMGAgGT_uTT7yX8FPRMrZ0w/exec";
const TOL = 5, TOL2 = 15;
const CAP = { "VAN 15": 15, "VAN 20": 20, "MICRO 30": 30, "ONIBUS 44": 44, "ÔNIBUS 44": 44 };
const COR_T = { "Turno 1": "#12968d", "ADM": "#4a55b8", "Juntos": "#12968d" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
const titulo = x => String(x).split(" ").map(w => (w === w.toUpperCase() && w.length > 2) ? w.charAt(0) + w.slice(1).toLowerCase() : w).join(" ");
const pad = n => String(n).padStart(2, "0");
const isoDe = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hojeISO = () => isoDe(new Date());
const menosDias = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - n); return isoDe(d) };
const ddmm = iso => iso.slice(8, 10) + "/" + iso.slice(5, 7);
const mm = t => { const m = String(t || "").match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null };
const tm = x => { const m = String(x || "").match(/^(\d{1,2}):(\d{2})/); return m ? m[1].padStart(2, "0") + ":" + m[2] : "" };
const pct = (a, b) => b ? Math.round(a / b * 100) : null;
const st = d => d == null ? "sem" : d <= TOL ? "ok" : d <= TOL2 ? "leve" : "atr";
const ST = { ok: "No horário", leve: "Atraso de até 15 min", atr: "Atraso acima de 15 min", sem: "Sem check" };
const ICO = { ok: "✓", leve: "!", atr: "!!", sem: "–" };
const pill = (s, txt) => `<span class="pill p-${s}">${ICO[s]} ${esc(txt || ST[s])}</span>`;
const pPont = p => p == null ? pill("sem", "Sem registro") : pill(p >= 90 ? "ok" : p >= 70 ? "leve" : "atr", p + "%");
const plate = id => { const k = id.split(" "); return `<span class="plate"><small>${esc(k[0])}</small><b>${esc(k.slice(1).join(" "))}</b></span>` };
const store = { get(k, d) { try { const v = localStorage.getItem("pbyd:" + k); return v == null ? d : JSON.parse(v) } catch (e) { return d } }, set(k, v) { try { localStorage.setItem("pbyd:" + k, JSON.stringify(v)) } catch (e) { } } };
async function api(params) {
  const url = API + "?" + new URLSearchParams(params).toString() + "&_=" + Date.now();
  const r = await fetch(url, { credentials: "omit", redirect: "follow", cache: "no-store" });
  const d = await r.json();
  if (d.status !== "ok") throw new Error(d.mensagem || "erro no script");
  return d;
}

const S = {
  view: store.get("view", "resumo"),
  rot: { data: hojeISO(), turno: "", q: "", ordem: "pont", sel: null, carregando: false, erro: "", res: null, em: null },
  res: { dias: store.get("dias", 15), modo: store.get("modo", "Juntos"), carregando: false, erro: "", d: null, em: null, ordem: { k: "pont", dir: 1 }, todas: false }
};
function go(v) { S.view = v; store.set("view", v); render(); if (v === "resumo" && !S.res.d) carregarResumo(); if (v === "rotas" && !S.rot.res) carregarRotas() }
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => go(b.dataset.v));
function render() {
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-current", b.dataset.v === S.view ? "page" : "false"));
  if (S.view === "resumo") renderResumo(); else renderRotas();
}
const tip = $("#tip");
function ligarTips(root) {
  root.querySelectorAll("[data-tip]").forEach(n => {
    n.addEventListener("mousemove", e => { tip.innerHTML = n.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 14, innerWidth - 290) + "px"; tip.style.top = (e.clientY + 14) + "px" });
    n.addEventListener("mouseleave", () => tip.hidden = true);
  });
}

/* ======================= RESUMO ======================= */
async function carregarResumo(manual) {
  const R = S.res; if (R.carregando) return;
  R.carregando = true; R.erro = ""; if (manual || !R.d) render();
  try { R.d = await api({ acao: "resumo", de: menosDias(hojeISO(), R.dias - 1), ate: hojeISO() }); R.em = new Date() }
  catch (e) { R.erro = e.message }
  R.carregando = false; if (S.view === "resumo") render();
}
const SOMA0 = () => ({ rotas: 0, paradas: 0, ok: 0, leve: 0, grave: 0, atr: 0, emb: 0, fora: 0, lista: 0, cap: 0 });
function somar(t, turnos) { const o = SOMA0(); turnos.forEach(k => { const x = t[k]; if (x) Object.keys(o).forEach(f => o[f] += x[f] || 0) }); return o }
function ind(o) { return { pont: pct(o.ok, o.paradas), atr: o.paradas ? Math.round(o.atr / o.paradas * 10) / 10 : null, comp: pct(o.emb, o.lista), ocup: pct(o.emb + o.fora, o.cap), emb: o.emb, fora: o.fora, paradas: o.paradas, rotas: o.rotas } }
function series(d, modo) {
  const grupos = modo === "Comparar" ? [["Turno 1", ["Turno 1"]], ["ADM", ["ADM"]]] : modo === "Juntos" ? [["Juntos", ["Turno 1", "ADM"]]] : [[modo, [modo]]];
  return grupos.map(([nome, ts]) => ({ nome, cor: COR_T[nome], pontos: d.dias.map(x => { const o = somar(x.t, ts); return { data: x.data, o, i: o.paradas || o.emb ? ind(o) : null } }), total: ind(d.dias.reduce((acc, x) => { const o = somar(x.t, ts); Object.keys(acc).forEach(f => acc[f] += o[f]); return acc }, SOMA0())) }));
}
function linha(sers, campo, opts) {
  const W = 600, H = 210, L = 38, Rr = 12, T = 12, B = 28, n = sers[0].pontos.length;
  const vals = sers.flatMap(s => s.pontos.map(p => p.i ? p.i[campo] : null)).filter(v => v != null);
  const max = opts.max != null ? opts.max : Math.max(5, Math.ceil(Math.max(...vals, 0) / 5) * 5);
  const x = i => L + (n === 1 ? (W - L - Rr) / 2 : i * (W - L - Rr) / (n - 1)), y = v => T + (H - T - B) * (1 - v / max);
  const ticks = opts.max === 100 ? [0, 50, 100] : [0, Math.round(max / 2), max];
  const passo = Math.ceil(n / 8);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.titulo)} por dia">`;
  ticks.forEach(t => { svg += `<line x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}" stroke="#e3eaed" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}${opts.suf}</text>` });
  sers[0].pontos.forEach((p, i) => { if (i % passo === 0 || i === n - 1) svg += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${ddmm(p.data)}</text>` });
  sers.forEach(s => {
    let d = "", aberto = false;
    s.pontos.forEach((p, i) => { const v = p.i ? p.i[campo] : null; if (v == null) { aberto = false; return } d += (aberto ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; aberto = true });
    svg += `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.pontos.forEach((p, i) => { const v = p.i ? p.i[campo] : null; if (v != null) svg += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.cor}" stroke="#fff" stroke-width="2"/>` });
  });
  // faixas de hover por dia (mostram todas as séries do dia)
  const larg = n === 1 ? (W - L - Rr) : (W - L - Rr) / (n - 1);
  sers[0].pontos.forEach((p, i) => {
    const linhas = sers.map(s => { const pp = s.pontos[i]; const v = pp.i ? pp.i[campo] : null; return `<span class='sw' style='background:${s.cor}'></span> ${esc(s.nome)}: <b>${v == null ? "sem dados" : String(v).replace(".", ",") + opts.suf}</b>` }).join("<br>");
    svg += `<rect x="${x(i) - larg / 2}" y="${T}" width="${larg}" height="${H - T - B}" fill="transparent" data-tip="<b>${ddmm(p.data)}</b><br>${linhas}"/>`;
  });
  return svg + "</svg>";
}
function renderResumo() {
  const R = S.res, d = R.d;

      pont: reg.length ? pct(reg.filter(s => s.s === "ok").length, reg.length) : null,

}

        pax.forEach(([nome, stt, h]) => {
          const row = ws.getRow(y);
          [i + 1, s.p, s.b, s.t, hm(s.real), sit(s), nome, stt, h].forEach((v, k) => { const c = row.getCell(k + 1); c.value = v; c.alignment = CENTRO; c.border = borda; c.font = { size: 11 } });
          const cs = row.getCell(8); cs.font = { size: 11, bold: true, color: { argb: "FF" + (stt === "Embarcou" ? "1F9E6A" : stt === "Não embarcou" ? "C2410C" : stt === "Fora da lista" ? "4A55B8" : "6B7280") } };
          const cor = corSit(s); if (cor) row.getCell(6).font = { size: 11, bold: true, color: { argb: "FF" + cor } };
          y++;
        });
        if (y - 1 > y0) for (let k = 1; k <= 6; k++) ws.mergeCells(y0, k, y - 1, k);
        if (i % 2) for (let yy = y0; yy < y; yy++) for (let k = 1; k <= N; k++) ws.getCell(yy, k).fill = fill("F7F9FA");
      });
      y += 2;
    }
  }
  const buf = await wb.xlsx.writeBuffer(), a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  a.download = nomeArq; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 1500);
}
function hhmm(v) { if (!v) return "—"; const m = String(v).match(/(\d{1,2}):(\d{2})/); if (/T/.test(v)) { const d = new Date(v); if (!isNaN(d)) return pad(d.getHours()) + ":" + pad(d.getMinutes()) } return m ? pad(+m[1]) + ":" + m[2] : String(v) }
function detalhe(r, emb) {
  const hm = x => x == null ? "—" : pad(Math.floor(x / 60)) + ":" + pad(x % 60);
  return `<div class="panel det"><div class="dtop"><span></span><div class="dh">${plate(r.id)}<div><h3>${esc(r.veic || "—")} · ${esc(r.turno)}${r.emp ? " · " + esc(r.emp) : ""}</h3><p class="d">${r.stops.length} paradas · 1ª apanha ${esc(r.ini || "—")}${r.cap ? " · " + r.cap + " lugares" : ""}</p></div></div><button class="btn xl xr" id="bexpr" ${S.rot.exportando ? "disabled" : ""}>${S.rot.exportando === "rota" ? "Gerando Excel…" : "⬇ Exportar rota " + esc(r.id)}</button></div>
    <div class="mini"><div><span>Pontualidade</span><b>${r.pont == null ? "—" : r.pont + "%"}</b></div><div><span>Embarcaram</span><b>${r.emb}/${r.lista}</b></div><div><span>Ocupação</span><b>${r.ocup == null ? "—" : r.ocup + "%"}</b></div><div><span>Fora da lista</span><b>${r.nf}</b></div></div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>#</th><th>Ponto</th><th class="num">Previsto</th><th class="num">1º check</th><th>Situação</th><th>Passageiros</th></tr></thead><tbody>
    ${r.stops.map((s, i) => `<tr><td><b>${i + 1}</b></td><td style="min-width:170px"><b>${esc(s.p)}</b><div style="font-size:13px;color:var(--muted)">${esc(s.b)}</div></td><td class="num"><span class="hora">${esc(s.t)}</span></td><td class="num"><span class="hora">${hm(s.real)}</span></td>
      <td>${s.d != null ? pill(s.s, s.d > 0 ? "+" + s.d + " min" : s.d === 0 ? "no horário" : s.d + " min") : pill("sem")}</td>
      <td><div class="chips">${s.pax.map(p => { const h = emb[p.ref]; return h ? `<span class="chip e"><span class="i">✓</span><span class="nm">${esc(p.n)}</span><span class="h">${esc(h)}</span></span>` : r.ativa ? `<span class="chip x"><span class="i">✕</span><span class="nm">${esc(p.n)}</span></span>` : `<span class="chip n"><span class="nm">${esc(p.n)}</span></span>` }).join("")}
      ${s.fora.map(f => `<span class="chip f"><span class="i">+</span><span class="nm">${esc(f.nome)}</span><span class="h">${esc(f.hora)}</span></span>`).join("")}</div></td></tr>`).join("")}
    </tbody></table></div>
    <div class="key"><b style="color:var(--fg)">Legenda:</b>
      <span class="chip e"><span class="i">✓</span>Embarcou <span class="h">06:16</span></span>
      <span class="chip x"><span class="i">✕</span><span class="nm">Não embarcou</span></span>
      <span class="chip f"><span class="i">+</span>Fora da lista</span></div></div>`;
}

render();
if (S.view === "resumo") carregarResumo(); else carregarRotas();
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  if (S.view === "rotas" && S.rot.data === hojeISO()) carregarRotas(false);
  if (S.view === "resumo") carregarResumo(false);
}, 3 * 60000);
</script>
</body>
</html>
